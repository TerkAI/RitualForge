name: RitualForge
main: com.skittlemc.ritualforge.RitualForgePlugin
version: ${version}
api-version: "1.21"
folia-supported: true
description: Boss encounters summoned through ritual shrines
author: SkittleMC

commands:
  ritualforge:
    description: Open the RitualForge boss guide
    usage: /ritualforge
    permission: ritualforge.use
    permission-message: "&cNo permission."
    aliases: [rf, bosses]

permissions:
  ritualforge.use:
    default: true
    description: Allows viewing the boss guide

  ritualforge.spawn:
    default: op
    description: Allows spawning bosses via command

  ritualforge.reload:
    default: op
    description: Allows reloading plugin configuration

  ritualforge.admin:
    default: op
    description: Full admin access to RitualForge
    children:
      ritualforge.use: true
      ritualforge.spawn: true
      ritualforge.reload: true
